name: Verify public release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python verify_evidence.py
      - name: Reject confidential release material
        shell: bash
        run: |
          set -euo pipefail
          forbidden='(\.safetensors$|\.gguf$|\.onnx$|\.pt$|\.pth$|\.ckpt$|\.pkl$|\.pickle$|\.pem$|\.key$|\.pfx$|\.env($|\.)|__pycache__|\.private-hosting|/runtime/|/state/|/models/)'
          if git ls-files | grep -Eiq "$forbidden"; then
            echo "Confidential or generated artifact detected"
            exit 1
          fi

