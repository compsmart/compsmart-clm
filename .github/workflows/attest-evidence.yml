name: Attest evidence

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read
  attestations: write

jobs:
  attest:
    if: ${{ hashFiles('evidence/manifest.json') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: evidence/manifest.json

